<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#0a0a0a" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- Calculator display -->
  <rect x="15" y="15" width="70" height="20" rx="5" fill="#1a1a1a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="75" y="29" font-family="Arial, sans-serif" font-size="10" fill="#fbbf24" text-anchor="end" font-weight="bold">123</text>
  
  <!-- Calculator buttons grid -->
  <!-- Row 1 -->
  <circle cx="25" cy="50" r="6" fill="#9333ea" filter="url(#glow)"/>
  <circle cx="42" cy="50" r="6" fill="#9333ea" filter="url(#glow)"/>
  <circle cx="59" cy="50" r="6" fill="#9333ea" filter="url(#glow)"/>
  <circle cx="76" cy="50" r="6" fill="#f59e0b" filter="url(#glow)"/>
  
  <!-- Row 2 -->
  <circle cx="25" cy="65" r="6" fill="#1a1a1a" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="42" cy="65" r="6" fill="#1a1a1a" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="59" cy="65" r="6" fill="#1a1a1a" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="76" cy="65" r="6" fill="#f59e0b" filter="url(#glow)"/>
  
  <!-- Row 3 -->
  <circle cx="25" cy="80" r="6" fill="#1a1a1a" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="36" y="74" width="30" height="12" rx="6" fill="#10b981" filter="url(#glow)"/>
  <text x="51" y="83" font-family="Arial, sans-serif" font-size="10" fill="#000" text-anchor="middle" font-weight="bold">=</text>
  <circle cx="76" cy="80" r="6" fill="#f59e0b" filter="url(#glow)"/>
  
  <!-- Pi symbol on top button -->
  <text x="25" y="53" font-family="Arial, sans-serif" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">π</text>
</svg>
